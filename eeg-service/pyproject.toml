[project]
name = "tauri-eeg-eeg-service"
version = "0.1.0"
description = "Real-time EEG decoding service: LSL ingestion, preprocessing, DE features, calibrated SVM"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.9.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false
